name: Gemini video comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare two public YouTube videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IPO_INSIGHTS_MODEL: ${{ vars.IPO_INSIGHTS_MODEL }}
          PYTHONPATH: scripts
        run: python3 scripts/diagnose_ipo_video.py
