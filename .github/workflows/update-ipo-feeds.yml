name: 공모주 채널·청약일정 수집

# KST 06:13(UTC 21:13) 아침 수집 + KST 16:13(UTC 07:13) 오후 수집.
# 정각·30분은 GitHub Actions 스케줄이 몰려 실제 실행이 수 시간 밀리므로 비정각 + 평일(1-5)로 둡니다.
on:
  schedule:
    - cron: '13 21 * * 1-5'
    - cron: '13 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ipo-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow (배너 생성용)
        run: python -m pip install --quiet pillow

      - name: 유튜브 자막 라이브러리
        continue-on-error: true
        run: python -m pip install --quiet youtube-transcript-api==1.2.3

      - name: YouTube RSS + 38커뮤니케이션 일정 수집 + data.json 전체 일정 병합
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IPO_INSIGHTS_MODEL: ${{ vars.IPO_INSIGHTS_MODEL }}
          IPO_INSIGHTS_VIDEO_FALLBACK: ${{ vars.IPO_INSIGHTS_VIDEO_FALLBACK || 'true' }}
        run: python3 scripts/fetch_ipo_feeds.py --sync-data --insights

      - name: 변경된 경우에만 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json data.json banner.png sitemap.xml insights.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "feeds: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 공모주 영상·일정·전체일정 수집"
          git push

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "## 공모주 피드 수집 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            echo ""
            echo "결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
