<body>
<div class="wrap">

  <header class="site-head">
    <div class="brandbar">
      <span class="brand">📈 공모주 데일리</span>
      <span class="updated" id="updated"></span>
    </div>
    <h1>오늘의 공모주 <em>1분 요약</em></h1>
    <div class="dateline">
      <span id="dateline">—</span>

  <div class="state" id="loading">오늘의 공모주를 정리하고 있어요…</div>

  <main id="main" hidden>
    <!-- 1레벨 · 오늘의 공모주 1분 요약 -->

      <summary class="ben-sum">

        <h2 class="sr-only">증권사 신규 개설 혜택</h2>
        <p class="ben-note" id="ev-note"></p>
        <div class="ev-list" id="ev-list"></div>

    <ul id="notice-list"></ul>
    <div class="foot-src" id="foot-src"></div>
