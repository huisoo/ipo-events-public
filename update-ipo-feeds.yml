name: 공모주 채널·청약일정 수집

# 매일 07:30 KST (UTC 22:30) + 손으로 돌리기
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ipo-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: YouTube RSS + 38커뮤니케이션 일정 수집
        run: python3 scripts/fetch_ipo_feeds.py

      - name: 변경된 경우에만 커밋·푸시
        run: |
          if git diff --quiet -- feeds.json; then
            echo "feeds.json 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git commit -m "feeds: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 공모주 영상·일정 수집"
          git push

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "## 공모주 피드 수집 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            echo ""
            echo "결과: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
